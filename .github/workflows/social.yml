# Monday 08:30 MYT: builds the week's posting pack (Pinterest bulk CSV + Threads posts)
# from pages that are live, and commits it under seo/social/packs/. Kenneth posts it by hand.
name: social
on:
  schedule:
    - cron: '30 0 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ship
  cancel-in-progress: false
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/social_pack.mjs
      - name: Commit
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add seo/social/
          git diff --cached --quiet || (git commit -m "social: weekly pack $(date -u +%F)" && git push origin main)
