# AI-answer prompt panel (scripts/geo_panel.mjs) on Gemini's free tier. Split over two days to stay
# under the daily grounding quota: Monday en+es, Tuesday zh+ko (09:00 MYT). Commits geo/ results.
name: geo
on:
  schedule:
    - cron: '0 1 * * 1'
    - cron: '0 1 * * 2'
  workflow_dispatch:
    inputs:
      locales:
        description: 'Comma-separated locales (en,es,zh,ko)'
        default: 'en,es'
permissions:
  contents: write
concurrency:
  group: ship
  cancel-in-progress: false
jobs:
  panel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prompt panel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEO_LOCALES: ${{ inputs.locales || (github.event.schedule == '0 1 * * 1' && 'en,es' || 'zh,ko') }}
        run: node scripts/geo_panel.mjs
      - name: Commit
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add geo/
          git diff --cached --quiet || (git commit -m "geo: prompt panel $(date -u +%F)" && git pull --rebase -q && git push origin main)
