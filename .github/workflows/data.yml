# Daily data pull (04:00 MYT, before the 06:00 bot run): GSC rankings +
# indexation, autocomplete keyword expansion, App Store language status.
# Commits to main under seo/ only (vercel.json skips deploys for seo-only commits).
name: data
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ship
  cancel-in-progress: false
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/build.mjs
      - name: Search Console
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: node scripts/gsc_pull.mjs
      - name: Autocomplete keywords
        run: node scripts/suggest.mjs
        continue-on-error: true
      - name: App Store languages (flips appLocalized when a language ships)
        run: |
          mkdir -p seo/data
          curl -sf "https://itunes.apple.com/lookup?id=6789787366&country=us" \
            | jq '{checked: (now|todate), version: .results[0].version, languages: .results[0].languageCodesISO2A}' > seo/data/app_store.json || true
      - name: Commit
        run: |
          git config user.name "seo-bot"
          git config user.email "seo-bot@users.noreply.github.com"
          git add seo/
          git diff --cached --quiet || (git commit -m "data: daily pull $(date -u +%F)" && git push origin main)
